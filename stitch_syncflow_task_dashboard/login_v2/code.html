<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Editorial Workspace - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#e8eff3",
                        "primary-fixed-dim": "#d0d5db",
                        "on-error": "#fff7f6",
                        "primary-dim": "#4e5358",
                        "on-tertiary-fixed": "#3e454c",
                        "surface-variant": "#d9e4ea",
                        "on-secondary": "#f6f9ff",
                        "on-primary": "#f4f8ff",
                        "surface": "#f8f9fb",
                        "primary-container": "#dee3e9",
                        "tertiary": "#586067",
                        "inverse-on-surface": "#9a9d9f",
                        "on-secondary-fixed-variant": "#545c65",
                        "secondary-fixed-dim": "#cdd5e0",
                        "tertiary-container": "#e4ecf5",
                        "on-primary-fixed": "#3b4045",
                        "on-secondary-container": "#4b535b",
                        "on-tertiary-fixed-variant": "#5a6269",
                        "error-dim": "#4e0309",
                        "on-secondary-fixed": "#384049",
                        "outline": "#717c82",
                        "inverse-surface": "#0b0f10",
                        "surface-dim": "#cfdce3",
                        "tertiary-fixed-dim": "#d6dee6",
                        "error-container": "#fe8983",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#d9e4ea",
                        "surface-container-high": "#e1e9ee",
                        "tertiary-fixed": "#e4ecf5",
                        "secondary": "#586069",
                        "on-primary-fixed-variant": "#575c62",
                        "background": "#f8f9fb",
                        "secondary-dim": "#4c545d",
                        "on-error-container": "#752121",
                        "on-primary-container": "#4d5258",
                        "tertiary-dim": "#4c545b",
                        "outline-variant": "#a9b4b9",
                        "inverse-primary": "#f0f4fb",
                        "secondary-container": "#dbe3ee",
                        "primary": "#5a5f65",
                        "secondary-fixed": "#dbe3ee",
                        "on-surface": "#2a3439",
                        "error": "#9f403d",
                        "on-tertiary-container": "#50585f",
                        "on-background": "#2a3439",
                        "surface-container-low": "#f0f4f7",
                        "primary-fixed": "#dee3e9",
                        "surface-bright": "#f8f9fb",
                        "surface-tint": "#5a5f65",
                        "on-tertiary": "#f5f9ff",
                        "on-surface-variant": "#566166"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-surface p-4 antialiased">
<!-- Main Container -->
<main class="w-full max-w-md">
<!-- Header / Logo Area -->
<div class="text-center mb-10">
<h1 class="text-2xl font-bold tracking-tight text-on-surface mb-2 font-headline">Editorial Workspace</h1>
<p class="text-sm text-on-surface-variant font-body">Sign in to continue to Slate &amp; Stone</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_12px_32px_-4px_rgba(42,52,57,0.08)] outline outline-1 outline-outline-variant/20">
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2 uppercase tracking-wide font-label" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-lg">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border-0 ring-1 ring-inset ring-outline-variant/50 focus:ring-2 focus:ring-inset focus:ring-primary/50 text-on-surface text-sm rounded-md placeholder:text-on-surface-variant/60 transition-shadow duration-300 ease-in-out font-body" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block text-sm font-medium text-on-surface uppercase tracking-wide font-label" for="password">Password</label>
<a class="text-xs font-medium text-primary hover:text-primary-dim hover:underline transition-colors duration-300 font-label" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-lg">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border-0 ring-1 ring-inset ring-outline-variant/50 focus:ring-2 focus:ring-inset focus:ring-primary/50 text-on-surface text-sm rounded-md placeholder:text-on-surface-variant/60 transition-shadow duration-300 ease-in-out font-body" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me & Submit -->
<div class="pt-2 flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant/50 text-primary focus:ring-primary/50 bg-surface-container-lowest transition-colors duration-300 cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-on-surface-variant cursor-pointer font-body" for="remember-me">Remember me</label>
</div>
</div>
<div>
<button class="w-full flex justify-center py-2.5 px-4 rounded-md shadow-sm text-sm font-medium text-on-primary bg-gradient-to-b from-primary to-primary-dim hover:from-primary-dim hover:to-[#3e4347] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-300 ease-linear font-label tracking-wide" type="submit">
                        Sign In
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-8">
<div class="relative flex items-center py-5">
<div class="flex-grow border-t border-outline-variant/20"></div>
<span class="flex-shrink-0 mx-4 text-xs text-on-surface-variant font-label tracking-widest uppercase">Or</span>
<div class="flex-grow border-t border-outline-variant/20"></div>
</div>
<!-- SSO Button -->
<button class="w-full flex items-center justify-center py-2.5 px-4 rounded-md border-0 ring-1 ring-inset ring-outline-variant/50 bg-surface-container-lowest text-sm font-medium text-on-surface hover:bg-surface-container-low transition-colors duration-300 ease-in-out font-label tracking-wide" type="button">
<img alt="Google logo" class="h-4 w-4 mr-2" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_63pXHnSh4PRNji6jJRMWKg-o9_jZhLQTYXsM3oduXk7FEyEDSyThFbrgdaQorsTRNIJb1Zlfk2p_24fe-G4zFO9TRoVCs0HOT5eDFEVc008kagdTiMn32Y7t1b531lwQDSfvi8_izBhnf9tv-9_ftuoLZQl6lkHYJ7czt50u90OT75rKqzVRvNg1SM22r8iNayMyTs5EGtWtfhC36xw7grv_Anu4Ynhp4smEdkGMl58Y7CAkzYe2tEeSYCXh8ZB8bbk10bNh"/>
                    Sign in with Google
                </button>
</div>
</div>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="text-xs text-on-surface-variant font-body">
                Don't have an account? 
                <a class="font-medium text-primary hover:text-primary-dim hover:underline transition-colors duration-300" href="#">Request access</a>
</p>
</div>
</main>
</body></html>
